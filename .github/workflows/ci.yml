name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in progress for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Every job that touches Prisma needs these; the values are throwaway CI ones.
  DATABASE_URL: postgresql://jecks:jecks@localhost:5432/jecks_test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-32
  JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-32
  CREDENTIALS_KEY: Y2ktb25seS1jaGFuZ2UtbWUtMzItYnl0ZXMta2V5IQ==

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jecks
          POSTGRES_PASSWORD: jecks
          POSTGRES_DB: jecks_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jecks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Turbo caches by task and input hash, so a docs-only change skips the builds.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migrate the test database
        run: pnpm --filter @jecks/db exec prisma migrate deploy

      - name: Seed structure only
        run: pnpm db:seed
        env:
          SEED_DEMO_DATA: 'false'

      # The completion plan's rule: no milestone marker survives v1. A left-behind
      # TODO(M5) is a screen somebody meant to come back to.
      - name: No milestone markers left behind
        run: |
          if grep -rn "TODO(M" apps packages e2e --include='*.ts' --include='*.tsx' --include='*.sql'; then
            echo "::error::Milestone TODOs are still in the source"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:cov

      # Reports rather than blocks: a transitive advisory with no patch available should
      # be seen and triaged, not left to break every pull request until somebody upstream
      # publishes a fix.
      - name: Dependency audit
        if: always()
        run: pnpm audit --audit-level moderate || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build all apps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Build Storybook
        run: pnpm --filter @jecks/ui build-storybook

  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jecks
          POSTGRES_PASSWORD: jecks
          POSTGRES_DB: jecks_migrate
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U jecks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Catches a migration that only works against a database that already has data,
      # and a schema.prisma edited without a matching migration.
      - name: Apply migrations
        run: pnpm --filter @jecks/db exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://jecks:jecks@localhost:5433/jecks_migrate?schema=public

      - name: Schema matches the migrations
        run: pnpm --filter @jecks/db exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
        env:
          DATABASE_URL: postgresql://jecks:jecks@localhost:5433/jecks_migrate?schema=public

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jecks
          POSTGRES_PASSWORD: jecks
          POSTGRES_DB: jecks_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jecks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://jecks:jecks@localhost:5432/jecks_e2e?schema=public
      NODE_ENV: test
      API_PORT: '4000'
      API_URL: http://localhost:4000/api/v1
      API_PUBLIC_URL: http://localhost:4000/api/v1
      STOREFRONT_URL: http://localhost:3000
      ADMIN_URL: http://localhost:5174
      CORS_ORIGINS: http://localhost:3000,http://localhost:5174
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: 'false'
      STORAGE_DRIVER: local
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      VITE_API_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @jecks/db exec prisma migrate deploy

      # Demo data, unlike the unit-test job: these specs confirm a seeded order and
      # print a seeded run's manifest.
      - name: Seed with demo data
        run: pnpm db:seed

      - run: pnpm build

      - name: Install Chromium
        run: pnpm e2e:install

      - name: Start the stack
        run: |
          pnpm --filter @jecks/api start > /tmp/api.log 2>&1 &
          pnpm --filter @jecks/worker start > /tmp/worker.log 2>&1 &
          pnpm --filter @jecks/storefront start > /tmp/storefront.log 2>&1 &
          pnpm --filter @jecks/admin preview --port 5174 --host > /tmp/admin.log 2>&1 &

      - name: Wait for it
        run: |
          for url in             http://localhost:4000/api/v1/health/ready             http://localhost:3000             http://localhost:5174; do
            for attempt in $(seq 1 60); do
              curl -fsS "$url" > /dev/null 2>&1 && break
              [ "$attempt" = 60 ] && { echo "::error::$url never answered"; cat /tmp/*.log; exit 1; }
              sleep 2
            done
          done

      - name: Run the specs
        run: pnpm e2e

      # A failed run is unreadable without the traces, and the logs usually say why.
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Images are only worth building for a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build, e2e]

    strategy:
      matrix:
        app: [api, worker, storefront, admin]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.app }}
          push: false
          tags: jecks/${{ matrix.app }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
