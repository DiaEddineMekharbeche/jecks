# Serves the built admin SPA. Every unknown path falls back to index.html, because
# React Router owns the routing once the bundle is loaded.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite fingerprints these filenames.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The shell itself must never be cached, or a deploy leaves stale asset references.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
