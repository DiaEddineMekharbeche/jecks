# Jeck's reverse proxy — PRD Section 10.10.
#
#   jecks-co.com        storefront (Next.js)
#   admin.jecks-co.com  admin SPA
#   api.jecks-co.com    API
#
# Used with NGINX_CONF=jecks-co.conf once the certificate exists (RUNBOOK 3).

# Rate limits are a second line of defence behind the API's own throttler: they stop
# a flood before it reaches Node at all.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# --- ACME challenge and HTTPS redirect --------------------------------------
server {
  listen 80;
  server_name jecks-co.com www.jecks-co.com admin.jecks-co.com api.jecks-co.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- shared TLS and security headers ----------------------------------------
# Included by each server block below.
map $host $unused_tls_map { default ''; }

# --- storefront --------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name jecks-co.com www.jecks-co.com;

  ssl_certificate     /etc/letsencrypt/live/jecks-co.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jecks-co.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Product imagery and 3D models are large; let them through.
  client_max_body_size 25m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Next.js fingerprints these, so they can be cached forever.
  location /_next/static/ {
    proxy_pass http://web:3000;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# --- admin -------------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name admin.jecks-co.com;

  ssl_certificate     /etc/letsencrypt/live/jecks-co.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jecks-co.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  # Staff tooling has no business being indexed.
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- api ---------------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name api.jecks-co.com;

  ssl_certificate     /etc/letsencrypt/live/jecks-co.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jecks-co.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;

  client_max_body_size 25m;

  # Sign-in and OTP are the endpoints worth guessing at, so they get their own budget.
  location ~ ^/api/v1/auth/(staff/login|otp) {
    limit_req zone=api_auth burst=5 nodelay;
    proxy_pass http://api:4000;
    include /etc/nginx/proxy_params_jecks;
  }

  # Server-sent events for the admin order stream: buffering would hold every
  # message until the connection closed.
  # The admin's live stream is /api/v1/admin/events; the old pattern never matched it, so it
  # was buffered like any page and the new-order sound arrived late.
  location /api/v1/admin/events {
    proxy_pass http://api:4000;
    # Not the shared proxy params: they set a 60 s read timeout, and nginx refuses a
    # directive given twice. The forwarded headers are the same ones, repeated.
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
  }

  location / {
    limit_req zone=api_general burst=40 nodelay;
    proxy_pass http://api:4000;
    include /etc/nginx/proxy_params_jecks;
  }
}
