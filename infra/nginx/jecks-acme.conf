# Answers only Let's Encrypt's challenge on port 80, so a certificate can be issued before
# the HTTPS site (jecks-co.conf) exists. NGINX_CONF=jecks-acme.conf while issuing; see RUNBOOK 3.
server {
  listen 80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
