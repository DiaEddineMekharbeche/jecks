# Production overlay. Used together with the base file, never on its own:
#
#   docker compose -f infra/docker/docker-compose.yml \
#                  -f infra/docker/docker-compose.prod.yml up -d
#
# What it changes: application containers are added, the datastores stop publishing
# ports to the host, and everything restarts unless explicitly stopped.

services:
  postgres:
    # Reachable only from the compose network. Backups run via `docker exec`.
    # `!override`: a plain `[]` merges with the base file's list and leaves the port published.
    ports: !override []
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200

  redis:
    ports: !override []

  # Uploads go to the media-data volume (STORAGE_DRIVER=local), so MinIO is not started.
  # `--profile s3-only` brings it back for a shop that moves to S3-compatible storage.
  minio:
    ports: !override []
    profiles: ['s3-only']

  minio-init:
    profiles: ['s3-only']

  mailpit:
    # Development mail catcher has no place in production; SMTP_HOST points at a
    # real relay instead.
    profiles: ['dev-only']

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ${IMAGE_PREFIX:-jecks}/api:${TAG:-latest}
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      # Nginx is always in front; 2 when the storefront on Vercel proxies through it too.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jecks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jecks}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Revalidation goes straight to the storefront container, not round the public URL.
      STOREFRONT_INTERNAL_URL: http://web:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - media-data:/data/media
    expose: ['4000']

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    image: ${IMAGE_PREFIX:-jecks}/worker:${TAG:-latest}
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-jecks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jecks}?schema=public
      REDIS_URL: redis://redis:6379
      # Internal routes (reports, maintenance, courier sync) over the compose network.
      API_INTERNAL_URL: http://api:4000/api/v1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - media-data:/data/media

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.storefront
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
    image: ${IMAGE_PREFIX:-jecks}/storefront:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side rendering talks to the API over the compose network, not the
      # public URL, so it works before DNS and TLS are in place.
      API_INTERNAL_URL: http://api:4000/api/v1
      # Must equal the API's, or /api/revalidate refuses and pages lag by minutes.
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
    depends_on: [api]
    expose: ['3000']

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_MEDIA_URL: ${VITE_MEDIA_URL}
        VITE_STOREFRONT_URL: ${VITE_STOREFRONT_URL:-}
    image: ${IMAGE_PREFIX:-jecks}/admin:${TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    expose: ['80']

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # 8080 and 8081 serve the admin and the API on the server's IP address while there is
    # no domain (jecks-ip.conf); they cost nothing once there is.
    ports: ['80:80', '443:443', '8080:8080', '8081:8081']
    volumes:
      # NGINX_CONF in .env picks the site: jecks-ip.conf (no domain), jecks-acme.conf (to
      # issue the certificate) or jecks-co.conf (the domain, over HTTPS).
      - ../nginx/${NGINX_CONF:-jecks-co.conf}:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/proxy_params_jecks:/etc/nginx/proxy_params_jecks:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on: [api, web, admin]

  certbot:
    image: certbot/certbot
    # Started only with a domain: COMPOSE_PROFILES=tls-only in .env.
    profiles: ['tls-only']
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Renews twice a day; Let's Encrypt only acts inside the last 30 days.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  certbot-www:
  certbot-conf:
  media-data:
